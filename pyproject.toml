[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "purrfectreqs"
version = "0.1.0"
description = "AI-powered requirements management system"
requires-python = ">=3.13"

dependencies = [
    # Framework web
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",

    # Bază de date
    "sqlalchemy[asyncio]==2.0.48",
    "alembic==1.18.4",
    "asyncpg==0.31.0",

    # Validare date și configurare
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",

    # Autentificare și securitate
    "PyJWT==2.12.1",
    "passlib[argon2]==1.7.4",
    "python-multipart==0.0.22",

    # Rate limiting și cache
    "fastapi-limiter==0.2.0",
    "redis==7.4.0",

    # Client HTTP (apeluri Ollama + client de test async)
    "httpx==0.28.1",

    # NLP și AI
    "spacy==3.8.13",
    "sentence-transformers==5.3.0",
    "python-docx==1.2.0",
    "gherkin-official==29.0.0",

    # Șabloane și fișiere statice
    "jinja2==3.1.6",
    "aiofiles==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-bdd==8.1.0",
    "ruff==0.15.11",
    "pre-commit==4.2.0",
    "bandit==1.8.3",
    "mypy==1.20.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "alembic/versions",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PGH", # pygrep-hooks: blocks bare `# type: ignore` without a reason comment
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI pattern: Depends(...) in argument defaults is idiomatic
    "UP042",  # str+Enum vs StrEnum — keep current form; revisit as a dedicated task
    "UP046",  # PEP 695 generic syntax — keep Generic[T] form; revisit as a dedicated task
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "auth: auth module tests",
    "new_user_registration: user registration tests",
    "smoke: smoke tests",
    "critical: critical path tests",
    "happy_path: happy path scenarios",
    "fail: failure scenarios",
]
filterwarnings = [
    "ignore::DeprecationWarning:gherkin",
    "ignore::DeprecationWarning:passlib",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# pydantic.mypy plugin is disabled — broken on mypy>=1.15 (upstream pydantic bug, tracked).
# Re-enable when pydantic ships a fix: plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
# skips = []  # add per-check skips here only if a finding can't be suppressed inline

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
